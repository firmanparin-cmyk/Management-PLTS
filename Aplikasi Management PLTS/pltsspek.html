<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="pltsspek.css">
  <title>Aplikasi Management Kebutuhan PLTS</title>
</head>
<body>
  <div class="card">
    <h2>Aplikasi Management Kebutuhan PLTS</h2>

    <div class="form-group">
      <label for="dayatotal">Daya Total (Wh)</label>
      <input type="number" id="dayatotal" placeholder="Contoh: 1000">
    </div>

    <div class="form-group">
      <label for="effisiensi">Efisiensi Sistem (0.7 - 0.8)</label>
      <input type="number" id="effisiensi" step="0.01" placeholder="Contoh: 0.75">
    </div>

    <div class="form-group">
      <label for="jammatahari">Lama Penyinaran Matahari (Jam)</label>
      <input type="number" id="jammatahari" placeholder="Contoh: 5">
    </div>

    <div class="form-group">
      <label for="rpanel">Rating Panel Tersedia (Wp)</label>
      <input type="number" id="rpanel" placeholder="Contoh: 100">
    </div>

    <div class="form-group">
      <label for="sistemplts">Tegangan Sistem PLTS (V)</label>
      <input type="number" id="sistemplts" placeholder="Contoh: 12">
    </div>

    <div class="form-group">
      <label for="invplts">Beban Total untuk Inverter (W)</label>
      <input type="number" id="invplts" placeholder="Contoh: 500">
    </div>

    <div class="form-group">
      <label for="hotonomi">Hari Otonomi (1 - 3 hari)</label>
      <input type="number" id="hotonomi" placeholder="Contoh: 2">
    </div>

    <div class="form-group">
      <label for="dodplts">Depth Of Discharge (0.5 - 0.8)</label>
      <input type="number" id="dodplts" step="0.01" placeholder="Contoh: 0.6">
    </div>

    <div class="form-group">
      <label for="rbaterai">Kapasitas Baterai Tersedia (Ah)</label>
      <input type="number" id="rbaterai" placeholder="Contoh: 100">
    </div>

     <div class="button-group">
      <button onclick="hitung()">Hitung</button>
      <button class="btn-clear" onclick="clearForm()">Clear</button>
    </div>

    <h3 id="hasil"></h3>
  </div>

  <script src="pltsspek.js"></script>
</body>
</html>
